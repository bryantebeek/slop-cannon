// ───────────────────────── camera / projection ─────────────────────────
let W = 0, H = 0, DPR = 1, F = 1, UI = 1, VIG = null, maxDPR = 2;

let AC = null, master, musicBus, noiseBuf, muted = false, nextNoteT = 0, stepI = 0;

function buildWave(n) {

document.addEventListener('pointerlockerror', () => { usingLock = false; });
cv.addEventListener('mousedown', e => { if (e.button === 0) primary(); else if (e.button === 2 && state === 'play') selectWeapon((weapon + 1) % unlocked); });
addEventListener('mouseup', e => { if (e.button === 0) firing = false; });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousemove', e => {
  if (state !== 'play') return;
  if (locked()) { aimYaw += e.movementX * SENS; aimPitch -= e.movementY * SENS; }
  else if (!usingLock) { aimYaw = (e.clientX / W - .5) * 2 * YAW_MAX; aimPitch = lerp(P_MAX, P_MIN, e.clientY / H); }
});
addEventListener('wheel', e => { if (state === 'play') selectWeapon(((weapon + Math.sign(e.deltaY)) % unlocked + unlocked) % unlocked); }, { passive: true });
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); if (state === 'play') firing = true; else if (!e.repeat) primary(); }
  if (/^Digit[1-4]$/.test(e.code) && state === 'play') selectWeapon(+e.code[5] - 1);
  if (e.code === 'KeyQ' && state === 'play') selectWeapon((weapon + unlocked - 1) % unlocked);
  if (e.code === 'KeyE' && state === 'play') selectWeapon((weapon + 1) % unlocked);
  if (e.code === 'KeyM') { muted = !muted; if (master) master.gain.value = muted ? 0 : .6; }
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play' && !locked()) { state = 'paused'; firing = false; }
  else if (e.code === 'KeyP' && state === 'paused') { state = 'play'; requestLock(); }
});
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space') firing = false; });
addEventListener('blur', () => { keys = {}; firing = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') { state = 'paused'; firing = false; } });
cv.addEventListener('touchstart', e => {
  e.preventDefault(); usingLock = false; initAudio();
  const t = e.changedTouches[0];
  if (state !== 'play') return primary();
  const VW = W / UI, VH = H / UI, slot = slotRects(VW, VH).findIndex(r => t.clientX / UI > r.x && t.clientX / UI < r.x + r.w && t.clientY / UI > r.y && t.clientY / UI < r.y + r.h);
  if (slot >= 0) return selectWeapon(slot);
  touchId = t.identifier; tx = t.clientX; ty = t.clientY; firing = true;
}, { passive: false });
cv.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === touchId) { aimYaw += (t.clientX - tx) * .004; aimPitch -= (t.clientY - ty) * .004; tx = t.clientX; ty = t.clientY; }
}, { passive: false });
cv.addEventListener('touchend', e => { for (const t of e.changedTouches) if (t.identifier === touchId) { touchId = null; firing = false; } });

// ───────────────────────── boot ─────────────────────────
wave = 2; buildWave(2);
let last = performance.now(), perfT = 0, perfN = 0;
function frame(now) {
  const realDt = Math.min(.05, (now - last) / 1000); last = now;
  // adaptive resolution: step render scale down while we can't hold ~50fps
  perfT += realDt; perfN++;
  if (perfT > 1.5) { if (perfN / perfT < 50 && DPR > 1 && !document.hidden) { maxDPR = Math.max(1, DPR - .5); resize(); } perfT = 0; perfN = 0; }
  if (slowT > 0) slowT -= realDt;
  update(state === 'paused' || state === 'over' ? (state === 'over' ? realDt * .3 : 0) : realDt * (slowT > 0 ? .3 : 1), realDt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
